services:
  music-hub:
    image: ghcr.io/stone-yu/music-hub:latest
    container_name: music-hub
    restart: unless-stopped
    ports:
      - "4733:23330"
    environment:
      TZ: Asia/Shanghai
      # Navidrome 连接
      NAVIDROME_URL: "http://your-navidrome:4533/"
      NAVIDROME_USER: "your-username"
      NAVIDROME_PASS: "your-password"
      # Web 登录密码
      LOGIN_PASSWORD: "your-login-password"
    volumes:
      # 下载的歌曲（让 Navidrome 也挂载此目录即可扫描入库）
      - ./data/downloads:/app/data/downloads
      # 刮削整理后的歌曲（按 艺术家/专辑 结构，映射到 Navidrome 音乐目录）
      - ./data/scraped:/app/data/scraped
      # 音源脚本目录（放 lx-music 音源 .js）
      - ./data/sources:/app/data/sources
      # 持久化数据（SQLite 数据库 + 曲库缓存）
      - ./data/db:/app/data/db
      # 配置文件
      - ./config.yaml:/app/config.yaml
    mem_limit: 512m
